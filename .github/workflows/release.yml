name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the GitHub Release and upload assets

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check tag matches VERSION
        run: |
          want="v$(tr -d ' \t\r\n' < VERSION)"
          case "$GITHUB_REF_NAME" in
            "$want" | "$want"-*) ;; # vX.Y.Z or a pre-release vX.Y.Z-rc.N
            *)
              echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($want); create releases with 'task bump'"
              exit 1
              ;;
          esac
      - run: go vet ./...
      - run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the changelog
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2.19"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with "Contents: read and write" on
          # jordigarciaventura/homebrew-tap. See DEVELOPMENT.md → Releasing.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
