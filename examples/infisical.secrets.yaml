# Example manifest for the Infisical backend. Place a file like this at the
# root of your repository (named secrets.yaml) and run `vault-sync pull`.
backend:
  type: infisical
  environment: dev # optional (default: dev): dev, staging, prod, …
  account: you@example.com # optional: email, its local part, or machine identity name
  server: https://infisical.example.com # optional: self-hosted or EU instance (default: the CLI's login)

project: my-project # Infisical project name, slug or id

files:
  - path: .env # secret ".env" in folder "/"

  - path: backend/.env.production # secret ".env.production" in folder "/backend"
    permissions: "0600"

  - path: /shared/keys/firmware-signing.key # folder "/shared/keys"
