version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G204 # subprocesses are the Bitwarden CLI / brew / ourselves, with fixed verbs
        - G304 # reading user-configured paths is the purpose of the tool
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jordigarciaventura/vault-sync
