# Example manifest. Place a file like this at the root of your repository
# (named secrets.yaml) and run `vault-sync pull`.
backend:
  type: bitwarden
  account: jordigarciaventura # optional: email or its local part

project: Example # Bitwarden folder name

files:
  - path: /shared/keys/firmware-signing.key # absolute destination
    permissions: "0600"

  - path: backend/.env # relative to this file's directory
    permissions: "0600"

  - path: backend/.env.production
